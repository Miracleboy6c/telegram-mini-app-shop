<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lavender Store - Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Kantumruy Pro', sans-serif; }</style>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8 text-slate-800">
  <div class="max-w-4xl mx-auto">
    <!-- Header -->
    <div class="flex items-center justify-between bg-white p-5 rounded-2xl shadow-sm border border-slate-200 mb-6">
      <div class="flex items-center gap-3">
        <span class="text-3xl">🌸</span>
        <div>
          <h1 class="text-xl font-bold text-purple-950">ផ្ទាំងគ្រប់គ្រង Lavender Store</h1>
          <p class="text-xs text-slate-500">បន្ថែម និងគ្រប់គ្រងទំនិញក្នុង Mini App</p>
        </div>
      </div>
      <a href="/" target="_blank" class="text-xs bg-purple-50 text-purple-700 px-3.5 py-2 rounded-xl font-semibold hover:bg-purple-100 transition">
        ↗ មើល Mini App
      </a>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <!-- Form បន្ថែមទំនិញ -->
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 h-fit">
        <h2 class="text-base font-bold text-slate-800 mb-4">➕ បន្ថែមទំនិញថ្មី</h2>
        <form id="product-form" onsubmit="handleCreateProduct(event)" class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">ឈ្មោះទំនិញ</label>
            <input type="text" id="p-name" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm outline-none focus:border-purple-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">ប្រភេទ (Category)</label>
            <select id="p-category" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm outline-none focus:border-purple-500">
              <option value="beauty">សម្រស់ (Beauty)</option>
              <option value="fashion">សម្លៀកបំពាក់ (Fashion)</option>
              <option value="electronics">គ្រឿងអេឡិចត្រូនិច (Electronics)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">តម្លៃ ($)</label>
            <input type="number" step="0.01" id="p-price" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm outline-none focus:border-purple-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Link រូបភាព (Image URL)</label>
            <input type="url" id="p-image" required placeholder="https://..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm outline-none focus:border-purple-500">
          </div>
          <button type="submit" class="w-full bg-purple-600 text-white py-2.5 rounded-xl font-bold text-sm hover:bg-purple-700 transition">
            រក្សាទុកទំនិញ
          </button>
        </form>
      </div>

      <!-- តារាងបញ្ជីទំនិញ -->
      <div class="md:col-span-2 bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
        <h2 class="text-base font-bold text-slate-800 mb-4">📦 បញ្ជីទំនិញដែលមានស្រាប់</h2>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs text-slate-600">
            <thead class="bg-slate-50 text-slate-700 uppercase font-semibold border-b">
              <tr>
                <th class="py-2.5 px-3">រូប</th>
                <th class="py-2.5 px-3">ឈ្មោះ</th>
                <th class="py-2.5 px-3">ប្រភេទ</th>
                <th class="py-2.5 px-3">តម្លៃ</th>
                <th class="py-2.5 px-3 text-right">សកម្មភាព</th>
              </tr>
            </thead>
            <tbody id="table-body" class="divide-y divide-slate-100">
              <!-- Rendered by JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function loadProducts() {
      const res = await fetch('/api/products');
      const products = await res.json();
      const tbody = document.getElementById('table-body');
      
      tbody.innerHTML = products.map(p => `
        <tr class="hover:bg-slate-50/50">
          <td class="py-2.5 px-3"><img src="${p.image}" class="w-9 h-9 object-cover rounded-lg border"></td>
          <td class="py-2.5 px-3 font-medium text-slate-800">${p.name}</td>
          <td class="py-2.5 px-3 capitalize"><span class="bg-purple-50 text-purple-700 px-2 py-0.5 rounded-md font-semibold">${p.category}</span></td>
          <td class="py-2.5 px-3 font-bold text-slate-800">$${p.price.toFixed(2)}</td>
          <td class="py-2.5 px-3 text-right">
            <button onclick="handleDelete(${p.id})" class="text-rose-500 hover:text-rose-700 font-semibold px-2 py-1 rounded">លុប</button>
          </td>
        </tr>
      `).join('');
    }

    async function handleCreateProduct(e) {
      e.preventDefault();
      const payload = {
        name: document.getElementById('p-name').value,
        category: document.getElementById('p-category').value,
        price: parseFloat(document.getElementById('p-price').value),
        image: document.getElementById('p-image').value
      };

      const res = await fetch('/api/admin/products', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        document.getElementById('product-form').reset();
        loadProducts();
      } else {
        alert('បរាជ័យក្នុងការបន្ថែមទំនិញ!');
      }
    }

    async function handleDelete(id) {
      if (!confirm('តើអ្នកពិតជាចង់លុបទំនិញនេះមែនទេ?')) return;
      const res = await fetch(`/api/admin/products/${id}`, { method: 'DELETE' });
      if (res.ok) {
        loadProducts();
      } else {
        alert('បរាជ័យក្នុងការលុប!');
      }
    }

    loadProducts();
  </script>
</body>
</html>
